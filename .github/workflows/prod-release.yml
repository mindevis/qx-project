name: Prod release

# Build → push GHCR → deploy to /opt/qxsystem (after CI passes on main).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

concurrency:
  group: prod-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      ref: ${{ steps.ref.outputs.value }}
    steps:
      - name: Resolve commit
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 2

      - name: Path filter
        id: filter
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -qE \
            '^(services/|web/|infra/docker/|infra/scripts/prod-|pkg/|go\.work$|go\.work\.sum$|\.github/workflows/prod-release\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No deploy-relevant paths changed — skipping prod release"
          fi

  build-push:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: prod-${{ needs.gate.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Set GHCR image owner (lowercase)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/qxapi/go.sum
            services/qxagent/go.sum

      - name: Build qx-agent-linux (embedded in API image)
        run: make build-agent-linux

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-api:prod

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '/api/v1' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-web:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-web:prod

  deploy:
    needs: [gate, build-push]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: prod-${{ needs.gate.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Set GHCR image owner (lowercase)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY GHCR_DEPLOY_TOKEN \
            PROD_JWT_SECRET PROD_SSH_MASTER_KEY PROD_MYSQL_ROOT_PASSWORD \
            PROD_MYSQL_PASSWORD PROD_MINIO_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret $name — see docs/production-deploy.md"
              exit 1
            fi
          done
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_SSH_MASTER_KEY: ${{ secrets.PROD_SSH_MASTER_KEY }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          PROD_MINIO_PASSWORD: ${{ secrets.PROD_MINIO_PASSWORD }}

      - name: Prepare deploy bundle
        env:
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_SSH_MASTER_KEY: ${{ secrets.PROD_SSH_MASTER_KEY }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          PROD_MINIO_PASSWORD: ${{ secrets.PROD_MINIO_PASSWORD }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || secrets.CORS_ORIGIN }}
          QX_PUBLIC_API_URL: ${{ vars.QX_PUBLIC_API_URL || secrets.QX_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p .deploy/nginx
          cp infra/docker/docker-compose.prod.runtime.yml .deploy/docker-compose.yml
          cp infra/docker/nginx/prod-http.conf .deploy/nginx/
          cp infra/docker/nginx/prod-tls.conf .deploy/nginx/
          cp infra/docker/nginx/prod-http.conf .deploy/nginx/active.conf
          cp infra/scripts/prod-certbot-cloudflare.sh .deploy/certbot-cloudflare.sh
          cp docs/schema.sql .deploy/
          cp infra/scripts/prod-remote-up.sh .deploy/up.sh
          cp infra/scripts/prod-merge-compose-env.sh .deploy/merge-compose-env.sh
          chmod +x .deploy/up.sh .deploy/merge-compose-env.sh .deploy/certbot-cloudflare.sh
          bash infra/scripts/prod-render-env.sh .deploy/.env.prod
          printf '%s\n' \
            "QX_API_IMAGE=ghcr.io/${IMAGE_OWNER}/qx-api:${IMAGE_TAG}" \
            "QX_WEB_IMAGE=ghcr.io/${IMAGE_OWNER}/qx-web:${IMAGE_TAG}" \
            > .deploy/image-tag.env
          bash infra/scripts/prod-merge-compose-env.sh .deploy

      - name: Setup SSH deploy key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_deploy
          ssh-keygen -y -f ~/.ssh/prod_deploy >/dev/null || {
            echo "::error::PROD_SSH_KEY is invalid — paste the full OpenSSH private key (with BEGIN/END lines)"
            exit 1
          }

      - name: Bootstrap VPS (Docker + /opt/qxsystem)
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/prod_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" 'bash -s' < infra/scripts/prod-bootstrap-vps.sh

      - name: Sync stack to VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/prod_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new -r \
            .deploy/. "${PROD_SSH_USER}@${PROD_SSH_HOST}:/opt/qxsystem/"

      - name: Pull images and restart stack
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.PROD_CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/prod_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "cd /opt/qxsystem && chmod 600 .env.prod && chmod +x up.sh certbot-cloudflare.sh && \
            GHCR_TOKEN=\"${GHCR_TOKEN}\" GHCR_USER=\"${GHCR_USER}\" \
            CLOUDFLARE_API_TOKEN=\"${CLOUDFLARE_API_TOKEN}\" CERTBOT_EMAIL=\"${CERTBOT_EMAIL}\" \
            ./up.sh"

      - name: Summary
        run: |
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: \`/opt/qxsystem\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`ghcr.io/${IMAGE_OWNER}/qx-api:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`ghcr.io/${IMAGE_OWNER}/qx-web:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CERTBOT_EMAIL:-}" ]]; then
            echo "- TLS: Let's Encrypt (Cloudflare DNS) for \`mc.qx-dev.ru\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- TLS: HTTP only — add \`PROD_CLOUDFLARE_API_TOKEN\` + \`PROD_CERTBOT_EMAIL\` for HTTPS" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.PROD_CERTBOT_EMAIL }}
