name: Prod release

# Build → push GHCR → deploy to /opt/qxsystem (fully automated from GitHub Secrets).
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - 'web/**'
      - 'infra/docker/**'
      - 'infra/scripts/prod-*.sh'
      - 'pkg/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/prod-release.yml'

concurrency:
  group: prod-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set GHCR image owner (lowercase)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/qxapi/go.sum
            services/qxagent/go.sum

      - name: Build qx-agent-linux (embedded in API image)
        run: make build-agent-linux

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-api:prod

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.qx-dev.ru/api/v1' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-web:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/qx-web:prod

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set GHCR image owner (lowercase)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_KEY GHCR_DEPLOY_TOKEN \
            PROD_JWT_SECRET PROD_SSH_MASTER_KEY PROD_MYSQL_ROOT_PASSWORD \
            PROD_MYSQL_PASSWORD PROD_MINIO_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret $name — see docs/production-deploy.md"
              exit 1
            fi
          done
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_SSH_MASTER_KEY: ${{ secrets.PROD_SSH_MASTER_KEY }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          PROD_MINIO_PASSWORD: ${{ secrets.PROD_MINIO_PASSWORD }}

      - name: Prepare deploy bundle
        env:
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_SSH_MASTER_KEY: ${{ secrets.PROD_SSH_MASTER_KEY }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
          PROD_MINIO_PASSWORD: ${{ secrets.PROD_MINIO_PASSWORD }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          QX_PUBLIC_API_URL: ${{ vars.QX_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p .deploy/nginx
          cp infra/docker/docker-compose.prod.runtime.yml .deploy/docker-compose.yml
          cp infra/docker/nginx/prod-split.conf .deploy/nginx/
          cp docs/schema.sql .deploy/
          cp infra/scripts/prod-remote-up.sh .deploy/up.sh
          chmod +x .deploy/up.sh
          bash infra/scripts/prod-render-env.sh .deploy/.env.prod
          printf '%s\n' \
            "QX_API_IMAGE=ghcr.io/${IMAGE_OWNER}/qx-api:${IMAGE_TAG}" \
            "QX_WEB_IMAGE=ghcr.io/${IMAGE_OWNER}/qx-web:${IMAGE_TAG}" \
            > .deploy/image-tag.env

      - name: Bootstrap VPS (Docker + /opt/qxsystem)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_path: infra/scripts/prod-bootstrap-vps.sh

      - name: Sync stack to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: .deploy/*
          target: /opt/qxsystem
          strip_components: 1
          overwrite: true

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/qxsystem
            chmod 600 .env.prod
            chmod +x up.sh
            GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" ./up.sh

      - name: Summary
        run: |
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: \`/opt/qxsystem\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`ghcr.io/${IMAGE_OWNER}/qx-api:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`ghcr.io/${IMAGE_OWNER}/qx-web:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
