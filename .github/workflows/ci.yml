name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.work.sum
      - run: cd services/qxapi && go mod tidy && go vet ./...
      - run: cd services/qxapi && go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g internal/api/openapi.go -o docs --parseInternal
      - run: cd services/qxapi && git diff --exit-code docs/ || (echo "Swagger docs out of date — run make swagger" && exit 1)
      - run: cd services/qxapi && go test ./... -count=1
      - run: cd services/qxagent && go test ./... -count=1
      - run: cd services/qxlauncher && go test ./... -count=1
      - run: |
          for pkg in reporoot envfile log mcmanifest protocol; do
            (cd pkg/$pkg && go test ./...)
          done
      - run: cd services/qxapi && go build -o /dev/null ./cmd
      - run: cd services/qxagent && go vet ./... && go build -o /dev/null ./cmd
      - run: cd services/qxlauncher && go vet ./... && go build -o /dev/null ./cmd
      - run: make build-launcher-win
      - uses: actions/upload-artifact@v7
        with:
          name: qx-launcher-windows-amd64
          path: bin/qx-launcher.exe
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/qxweb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/qxweb/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
