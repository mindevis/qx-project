# HTTPS + HTTP→HTTPS redirect (Let's Encrypt via Cloudflare DNS).
# Certs on host: /etc/letsencrypt/live/mc.qx-dev.ru/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream qx_api {
    server api:3000;
}

upstream qx_web {
    server web:80;
}

server {
    listen 80;
    server_name mc.qx-dev.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mc.qx-dev.ru;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/mc.qx-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc.qx-dev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://qx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location /agent/ {
        proxy_pass http://qx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location /swagger/ {
        proxy_pass http://qx_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://qx_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
