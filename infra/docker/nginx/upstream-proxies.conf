# Game server version metadata proxies for QXWeb (/upstream/*).
# Mirrors web/qxweb/vite.proxy.ts — keep both in sync when adding hosts.

location /upstream/forge/ {
    proxy_pass https://files.minecraftforge.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host files.minecraftforge.net;
}

location /upstream/mavenforge/ {
    proxy_pass https://maven.minecraftforge.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host maven.minecraftforge.net;
}

location /upstream/papermc/ {
    proxy_pass https://fill.papermc.io/;
    proxy_ssl_server_name on;
    proxy_set_header Host fill.papermc.io;
    proxy_set_header User-Agent "QXProject/1.0 (https://github.com/qxproject/qx)";
}

location /upstream/purpur/ {
    proxy_pass https://api.purpurmc.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.purpurmc.org;
}

location /upstream/neoforge/ {
    proxy_pass https://maven.neoforged.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host maven.neoforged.net;
}

location /upstream/fabric/ {
    proxy_pass https://meta.fabricmc.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host meta.fabricmc.net;
}

location /upstream/quilt/ {
    proxy_pass https://meta.quiltmc.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host meta.quiltmc.org;
}

location /upstream/mohist/ {
    proxy_pass https://mohistmc.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host mohistmc.com;
}

location /upstream/magma/ {
    proxy_pass https://magmafoundation.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host magmafoundation.org;
}

location /upstream/arclight/ {
    proxy_pass https://files.hypertention.cn/;
    proxy_ssl_server_name on;
    proxy_set_header Host files.hypertention.cn;
}
