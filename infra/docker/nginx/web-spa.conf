server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /downloads/ {
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
