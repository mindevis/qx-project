# QXSystem — production runtime (pull images from GHCR, no build on platform host)
# Deploy: GitHub Actions → /opt/qxsystem
# Images: QX_API_IMAGE / QX_WEB_IMAGE in image-tag.env (written by CI)

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qx}
      MYSQL_USER: ${MYSQL_USER:-qx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - qx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - qx

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - qx

  api:
    image: ${QX_API_IMAGE:?set QX_API_IMAGE}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_ADDR: :3000
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_DSN: ${DATABASE_DSN}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SSH_MASTER_KEY: ${SSH_MASTER_KEY}
      QX_PUBLIC_API_URL: ${QX_PUBLIC_API_URL}
      MOJANG_CLIENT_ID: ${MOJANG_CLIENT_ID:-}
      MOJANG_CLIENT_SECRET: ${MOJANG_CLIENT_SECRET:-}
      MOJANG_OAUTH_REDIRECT_URI: ${MOJANG_OAUTH_REDIRECT_URI:-}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
      MODRINTH_USER_AGENT: ${MODRINTH_USER_AGENT:-}
      QX_AGENT_BINARY_PATH: ${QX_AGENT_BINARY_PATH:-/opt/qxsystem/bin/qx-agent-linux}
      LAUNCHER_VERSION: ${LAUNCHER_VERSION:-0.1.0-dev}
      LAUNCHER_DOWNLOAD_URL: ${LAUNCHER_DOWNLOAD_URL:-/downloads/qx-launcher.exe}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qx

  web:
    image: ${QX_WEB_IMAGE:?set QX_WEB_IMAGE}
    pull_policy: always
    restart: unless-stopped
    networks:
      - qx

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gzip.conf:/etc/nginx/conf.d/gzip.conf:ro
      - ./nginx/spa-security-headers.conf:/etc/nginx/spa-security-headers.conf:ro
      - ./nginx/upstream-proxies.conf:/etc/nginx/upstream-proxies.conf:ro
      - ./nginx/qtranslator.conf:/etc/nginx/conf.d/qtranslator.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - qx

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  qx:
    driver: bridge
