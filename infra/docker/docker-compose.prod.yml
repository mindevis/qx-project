# QXSystem — production stack (build locally, deploy pre-built bundle to platform host)
# Build: make prod-build  |  Pack: make prod-pack  |  Dev smoke: make prod-up

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qx}
      MYSQL_USER: ${MYSQL_USER:-qx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - qx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - qx

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - qx

  api:
    image: qx-api:${QX_IMAGE_TAG:-prod}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_ADDR: :3000
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_DSN: ${DATABASE_DSN}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SSH_MASTER_KEY: ${SSH_MASTER_KEY}
      QX_PUBLIC_API_URL: ${QX_PUBLIC_API_URL}
      QX_AGENT_BINARY_PATH: ${QX_AGENT_BINARY_PATH:-/opt/qxsystem/bin/qx-agent-linux}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qx

  web:
    image: qx-web:${QX_IMAGE_TAG:-prod}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_LAUNCHER_DOWNLOAD_URL: ${VITE_LAUNCHER_DOWNLOAD_URL:-/downloads/qx-launcher.exe}
    restart: unless-stopped
    networks:
      - qx

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/spa-security-headers.conf:/etc/nginx/conf.d/spa-security-headers.conf:ro
      - ./nginx/upstream-proxies.conf:/etc/nginx/conf.d/upstream-proxies.conf:ro
    depends_on:
      - api
      - web
    networks:
      - qx

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  qx:
    driver: bridge
